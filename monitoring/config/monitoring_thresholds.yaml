# Monitoring thresholds ("traffic lights").
#
# Edit these values to match the bank's / captain's risk appetite; the engine
# reads them at run time so no code changes are needed. Bands are deliberately
# conservative starter values consistent with common industry practice.
version: 1

psi:
  n_bins: 10
  green_below: 0.10      # PSI < 0.10        -> green
  amber_below: 0.25      # 0.10 <= PSI < 0.25 -> amber, PSI >= 0.25 -> red

csi:
  n_bins: 10
  green_below: 0.10
  amber_below: 0.25

discrimination:
  # Gini is compared with the development-baseline Gini as a *relative* drop:
  # rel_drop = (baseline_gini - current_gini) / baseline_gini.
  gini:
    rel_drop_green_below: 0.10   # < 10% drop    -> green
    rel_drop_amber_below: 0.20   # 10-20% drop   -> amber, >= 20% -> red
  # KS is compared as an absolute drop from the baseline KS.
  ks:
    abs_drop_green_below: 0.05
    abs_drop_amber_below: 0.10

calibration:
  method: hosmer_lemeshow
  n_bands: 10
  # Overall Hosmer-Lemeshow p-value: high = good fit.
  hl:
    green_pvalue_at_or_above: 0.05   # p >= 0.05 -> green
    amber_pvalue_at_or_above: 0.01   # 0.01 <= p < 0.05 -> amber, p < 0.01 -> red
  # Per-band exact binomial test.
  binomial:
    alpha_green: 0.05    # p < 0.05 -> amber (band is drifting)
    alpha_red: 0.01      # p < 0.01 -> red   (band clearly miscalibrated)
    min_band_size: 30    # ignore bands smaller than this for alerting
  # A band whose observed minus expected default rate exceeds this (absolute)
  # is flagged even before the binomial test, as a practical guard.
  max_band_deviation_amber: 0.05
  max_band_deviation_red: 0.10
